[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "great-silence"
version = "0.1.0"
description = "Monte Carlo simulation of galactic civilizations and the Great Filter"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "numba>=0.57.0",  # JIT compilation for performance
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
webapp = [
    "nicegui>=2.0.0",
]
viz = [
    "plotly>=5.14.0",
    "mayavi>=4.8.0",
    "pyvista>=0.40.0",
]
notebook = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.1.0",
    "ipympl>=0.9.0",
    "pythreejs>=2.4.0",
    "h5py>=3.9.0",
]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "ruff>=0.0.270",
    "mypy>=1.3.0",
]

[project.scripts]
great-silence = "great_silence.cli:main"
great-silence-webapp = "great_silence.webapp.__main__:main"

[tool.setuptools]
packages = ["great_silence", "great_silence.galaxy", "great_silence.astrophysics", "great_silence.civilization", "great_silence.simulation", "great_silence.visualization", "great_silence.config", "great_silence.utils", "great_silence.notebook", "great_silence.webapp", "great_silence.webapp.components"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=great_silence --cov-report=term-missing"
