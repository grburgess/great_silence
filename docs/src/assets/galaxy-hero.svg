<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="heroGalaxy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:0.9" />
      <stop offset="15%" style="stop-color:#fbbf24;stop-opacity:0.7" />
      <stop offset="30%" style="stop-color:#c084fc;stop-opacity:0.5" />
      <stop offset="60%" style="stop-color:#8B5CF6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="heroCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fef3c7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#0a0a0f"/>
  
  <!-- Outer nebula glow -->
  <ellipse cx="200" cy="200" rx="180" ry="60" fill="url(#heroGalaxy)" transform="rotate(-25, 200, 200)" opacity="0.4"/>
  <ellipse cx="200" cy="200" rx="160" ry="50" fill="url(#heroGalaxy)" transform="rotate(45, 200, 200)" opacity="0.3"/>
  
  <!-- Galaxy spiral arms -->
  <g transform="translate(200, 200)">
    <ellipse cx="0" cy="0" rx="140" ry="35" fill="url(#heroGalaxy)" transform="rotate(-30)" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="130" ry="30" fill="url(#heroGalaxy)" transform="rotate(60)" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="120" ry="28" fill="url(#heroGalaxy)" transform="rotate(150)" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="100" ry="25" fill="url(#heroGalaxy)" transform="rotate(-60)" opacity="0.5"/>
    
    <!-- Galaxy core -->
    <circle cx="0" cy="0" r="40" fill="url(#heroCore)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="20" fill="#fef3c7" opacity="0.95"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
  </g>
  
  <!-- Stars scattered around -->
  <g fill="#ffffff">
    <circle cx="50" cy="80" r="2" opacity="0.8"/>
    <circle cx="350" cy="60" r="1.5" opacity="0.6"/>
    <circle cx="320" cy="320" r="2" opacity="0.7"/>
    <circle cx="70" cy="340" r="1.5" opacity="0.5"/>
    <circle cx="40" cy="200" r="1" opacity="0.4"/>
    <circle cx="360" cy="180" r="1" opacity="0.6"/>
    <circle cx="150" cy="50" r="1.5" opacity="0.5"/>
    <circle cx="280" cy="370" r="1" opacity="0.4"/>
    <circle cx="100" cy="150" r="1" opacity="0.6"/>
    <circle cx="310" cy="130" r="1.5" opacity="0.5"/>
  </g>
  
  <!-- Colored stars -->
  <circle cx="90" cy="290" r="1.5" fill="#8B5CF6" opacity="0.8"/>
  <circle cx="330" cy="250" r="1" fill="#00ffff" opacity="0.7"/>
  <circle cx="180" cy="380" r="1" fill="#fbbf24" opacity="0.6"/>
  <circle cx="250" cy="30" r="1.5" fill="#00ffff" opacity="0.5"/>
  
  <!-- Civilization markers (small bright dots) -->
  <g filter="url(#glow)">
    <circle cx="170" cy="185" r="3" fill="#22c55e" opacity="0.9"/>
    <circle cx="235" cy="210" r="2.5" fill="#00ffff" opacity="0.8"/>
    <circle cx="190" cy="225" r="2" fill="#fbbf24" opacity="0.7"/>
  </g>
  
  <!-- Probe trajectory line -->
  <path d="M 170 185 Q 200 195 235 210" stroke="#00ffff" stroke-width="1" fill="none" opacity="0.5" stroke-dasharray="3,3"/>
</svg>
